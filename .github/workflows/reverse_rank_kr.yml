# reverse_rank_kr 알림.
#
# 트리거는 workflow_dispatch 하나뿐이다. schedule 을 두지 않는다 —
# 외부 스케줄러와 함께 발화해 같은 알림이 두 번 가고, 막으려면 중복 검사 로직이
# 워크플로마다 붙는다 (docs/DESIGN.md 6.3 절).
#
# 정시 트리거는 cron-job.org 가 이 워크플로를 dispatch 해서 만든다.

name: reverse_rank_kr

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 보내지 않고 로그로만 확인합니다
        required: false
        default: false
        type: boolean

# 같은 알림이 겹쳐 도는 것을 막는다. 앞선 실행을 취소하지는 않는다
concurrency:
  group: reverse_rank_kr
  cancel-in-progress: false

jobs:
  run:
    # 재사용 워크플로는 호출자의 권한을 낮출 수만 있고 올릴 수 없다.
    # 여기서 주지 않으면 _run_alert.yml 의 actions: read 요구가 거부돼
    # 실행이 시작조차 하지 못한다 (startup_failure).
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_run_alert.yml
    with:
      alert: reverse_rank_kr
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
