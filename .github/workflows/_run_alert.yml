# 알림 하나를 실행하는 공용 절차. 호출 워크플로 둘이 알림 이름만 바꿔 부른다.
#
# 실패 알림은 파이썬이 보낸다 — 워크플로에서 따로 보내면 같은 실패가 두 번 온다.
# 준비 단계가 깨졌을 때 무엇이 그것을 드러내는지는 docs/DESIGN.md §7.2 에 있다.

name: 알림 실행

on:
  workflow_call:
    inputs:
      alert:
        description: 실행할 알림 이름
        required: true
        type: string
      # 호출자는 `${{ inputs.dry_run == true }}` 로 한 번 비교해 넘긴다. workflow_dispatch 의 boolean 입력을
      # 그대로 넘기면 문자열로 평가되는 사례가 있어, 비교를 거쳐 언제나 boolean 이 되게 한다
      dry_run:
        description: 참이면 보내지 않고 로그로만 확인한다
        required: false
        default: false
        type: boolean

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # 점검 줄이 실행 이력을 읽는 데 필요하다
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Poetry 설치
        run: pipx install poetry

      - name: 의존성 설치
        run: poetry install --without dev

      # dry-run 이면 문구를 로그로만 찍고 보내지 않는다. 발송 전 확인용이다
      - name: 알림 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: poetry run python -m notify ${{ inputs.alert }}${{ inputs.dry_run && ' --dry-run' || '' }}

