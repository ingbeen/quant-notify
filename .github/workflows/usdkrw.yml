# usdkrw 알림. 트리거는 cron-job.org 가 부르는 workflow_dispatch 하나뿐이다 (docs/DESIGN.md §6.2 · §6.3).

name: usdkrw

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 보내지 않고 로그로만 확인합니다
        required: false
        default: false
        type: boolean

# 같은 알림이 겹쳐 도는 것을 막는다. 앞선 실행을 취소하지는 않는다
concurrency:
  group: usdkrw
  cancel-in-progress: false

jobs:
  run:
    # 재사용 워크플로는 호출자의 권한을 올릴 수 없어, 여기서 주지 않으면 시작조차 못 한다 (docs/DESIGN.md §6.2 ②)
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_run_alert.yml
    with:
      alert: usdkrw
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
