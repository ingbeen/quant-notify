[pytest]
testpaths = tests

# 사람이 쓰는 상태 파일과 가상환경은 수집하지 않는다
norecursedirs = state .venv

python_files = test_*.py
python_classes = Test*
python_functions = test_*

minversion = 9.0

# pandas 의 FutureWarning 은 외부 라이브러리 경고라 숨기고, DeprecationWarning 은 보이게 둔다
filterwarnings =
    ignore::FutureWarning:pandas
    default::DeprecationWarning

addopts =
    -ra
    --strict-markers
    --tb=short

log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
