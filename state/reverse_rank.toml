# 폭등·폭락 순위 등락률
#
# 사람이 손으로 고치는 파일입니다. 프로그램은 읽기만 합니다.
# 갱신 시점: 신호가 난 날 재계산합니다.
#
# 값은 **비율**입니다 — 0.0610 이 +6.10% 입니다.
# 퍼센트로 적으면(6.10) 로딩할 때 예외가 납니다.
#
# [중요] 소수 4자리로 적되 **반올림하지 않고 덜 극단적인 쪽(0 쪽)으로 자릅니다.**
# 폭등 +0.0768913 → 0.0768, 폭락 -0.0781966 → -0.0781. 반올림하면 임계가 정본보다
# 엄격해질 수 있고, 그 틈에 든 신호일은 근접으로만 알려지며 순위 갱신 경고도 오지 않습니다.
#
# rank_cut 은 몇 위까지를 신호로 세는지(순위 컷)이고, surge_cut·plunge_cut 은
# 그 순위의 등락률입니다. 컷이 바뀌면 세 값을 함께 고칩니다 — 주간 알림이
# rank_cut 으로 「N위」를 적으므로, 하나만 고치면 라벨과 값이 어긋난 채 나갑니다.
#
# [중요] data_to 는 줄 세우기에 넣은 마지막 날입니다. 알림이 이 날짜를 기준으로
# 「그 뒤에 순위 컷 안에 든 날이 있는가」를 보고 갱신 필요를 알리므로, 값을 다시 계산하면
# data_to 도 함께 올립니다. 올리지 않으면 갱신한 뒤에도 경고가 계속 옵니다.
#
# 근거: docs/DESIGN.md 5.2 절 · reference/역방향_매매_규칙.md 1.5 절

[kodex200]
data_from = 2002-10-15
data_to = 2026-09-23
rank_cut = 10
surge_1st = 0.2417
surge_cut = 0.0768
plunge_1st = -0.1246
plunge_cut = -0.0817

[qqq]
