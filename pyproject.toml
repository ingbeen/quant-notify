[tool.poetry]
name = "quant-notify"
authors = ["Yubeen"]
version = "0.1.0"
description = "quant / verify-lab 매매 규칙의 신호를 텔레그램으로 알리는 무상태 알림 시스템"
packages = [
    {include = "notify", from = "src"},
]

[tool.poetry.dependencies]
python = "~3.12"
pandas = "^2.0.0"
yfinance = "^0.2.0"
requests = "^2.31.0"
python-dotenv = "^1.2.2"
exchange-calendars = "^4.5.0"

[tool.poetry.group.dev.dependencies]
black = "^23.0.0"
ruff = "^0.8.0"
pandas-stubs = "^2.0.0"
types-requests = "^2.31.0"
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
freezegun = "^1.5.5"
pyright = "^1.1.407"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ['py312']
extend-exclude = "^/reference/"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["reference"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long은 Black 스타일 존중
]

[tool.ruff.lint.isort]
known-first-party = ["notify"]

[tool.coverage.run]
omit = [
    "tests/*",
    "*/site-packages/*",
]

[tool.coverage.report]
show_missing = true
